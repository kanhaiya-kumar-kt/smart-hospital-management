spring.application.name=hospitalManagement

# ============================
# Database Configuration
# ============================
spring.datasource.url=jdbc:postgresql://localhost:5432/HospitalDB
spring.datasource.username=postgres
spring.datasource.password=root
server.servlet.context-path=/api/v1

# ============================
# JPA / Hibernate
# ============================
# Use 'update' so schema persists & works with data.sql
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# ============================
# SQL Initialization
# ============================
# Ensures Hibernate creates tables first, then data.sql runs
spring.jpa.defer-datasource-initialization=true

# Run data.sql every time app starts
spring.sql.init.mode=always

# Location of data.sql
spring.sql.init.data-locations=classpath:data.sql


