spring:
  security.oauth2.client:
    Provider:
      twitter:
        authorization-uri: https://twitter.com/i/oauth2/authrize
        token-uri: https://api.twitter.com/2/oauth2/token
        user-info-uri: https://twitter.com/2/user/m

    registration:
      google:
        client-id: YOUR_GOOGLE_CLIENT_ID
        client-secret: YOUR_GOOGLE_CLIENT_SECRET

      github:
        client-id: YOUR_GITHUB_CLIENT_ID
        client-secret: YOUR_GITHUB_CLIENT_SECRET

      twitter:
        client-id: YOUR_TWITTER_CLIENT_ID
        client-secret: YOUR_TWITTER_CLIENT_SECRET
        redirect-uri: "{baseUrl}/login/oauth2/code/twitter"
        authorization-grant-type: authorization_code
        client-name: Twitter
        provider: twitter